# deploy.sh replaces __DOMAIN__ with GRAMSETU_DOMAIN before installing this file.

# Plain HTTP: certificate renewals and speaker nodes that were set up with an http:// address.
# Everything else goes to the HTTPS site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 30M;
    root /var/www/gramsetu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /downloads/ {
        try_files $uri =404;
    }

    location /api/device/ {
        include snippets/gramsetu-proxy.conf;
    }

    location ~ ^/ws/(device|tunnel)$ {
        include snippets/gramsetu-ws.conf;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # Points at the Let's Encrypt certificate (renewed by certbot.timer), or the
    # self-signed one until the first certificate is issued.
    ssl_certificate /etc/nginx/ssl/site.crt;
    ssl_certificate_key /etc/nginx/ssl/site.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gramsetu_ssl:10m;

    include snippets/gramsetu-locations.conf;
}

# HTTPS by IP address or any other name.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/gramsetu.crt;
    ssl_certificate_key /etc/nginx/ssl/gramsetu.key;

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}
