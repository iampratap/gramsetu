services:
  db:
    image: postgres:16-alpine
    container_name: gramsetu-db
    environment:
      POSTGRES_USER: gramsetu
      POSTGRES_PASSWORD: gramsetu
      POSTGRES_DB: gramsetu
    ports:
      - "5432:5432"
    volumes:
      - ./gramsetu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gramsetu -d gramsetu || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    labels:
      - autoheal=true

  api:
    build: ./backend
    container_name: gramsetu-api
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      # Reach Postgres on the compose network (overrides localhost from .env)
      DATABASE_URL: postgresql://gramsetu:gramsetu@db:5432/gramsetu?schema=public
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal=true

  # Restarts containers marked autoheal=true when their healthcheck stays unhealthy
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: gramsetu-autoheal
    depends_on:
      - api
      - db
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 40
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
